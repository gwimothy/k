{
    "version": 9,
    "name": "k",
    "fileformats": [
        { "format": "Valve" }
    ],
    "filesystem": {
        "searchpath": "base",
        "packageformat": { "extension": ".zip", "format": "zip" }
    },
    "materials": {
        "root": "materials",
        "extensions": [".png", ".tga", ".jpg"],
        "excludes": ["skybox/*", "models/*"]
    },
    "entities": {
        "definitions": [ "k.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0",
        "scale": 1
    },
    "tags": {
        "brush": [
            { "name": "Detail", "match": "classname", "pattern": "func_detail" }
        ],
        "brushface": [
            { "name": "Skybox", "match": "material", "pattern": "tools/toolsskybox" },
            { "name": "Nodraw", "match": "material", "pattern": "tools/toolsnodraw", "attribs": ["transparent"] },
            { "name": "Clip", "match": "material", "pattern": "tools/tools*clip", "attribs": ["transparent"] }
        ]
    }
}
