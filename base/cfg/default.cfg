// Default key bindings and settings. Loaded first on every launch; config.cfg
// (written on exit) and autoexec.cfg run afterwards and override these.

bind "`" "toggleconsole"
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "space" "+jump"
bind "ctrl" "+duck"
bind "shift" "+speed"
bind "alt" "+walk"
bind "e" "+use"
bind "r" "+reload"
bind "mouse1" "+attack"
bind "mouse2" "+attack2"
bind "f5" "screenshot"
bind "f9" "toggle cl_showfps"
bind "f10" "toggle cl_showpos"
